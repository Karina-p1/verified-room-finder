{% extends 'base.html' %}
{% block title %}Password Reset Complete — RoomFinder{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:480px;">
    <div class="card border-0 shadow-sm p-4 text-center">
        <i class="bi bi-shield-check text-success" style="font-size:3.5rem;"></i>
        <h3 class="fw-bold mt-3 text-success">Password Reset!</h3>
        <p class="text-muted mt-2">
            Your password has been successfully changed.
            You can now log in with your new password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3 px-5">
            <i class="bi bi-box-arrow-in-right"></i> Login Now
        </a>
    </div>
</div>
{% endblock %}
